name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Upload tn3270win.exe
        uses: actions/upload-artifact@v4
        with:
          name: tn3270win-windows-x64
          path: target/release/tn3270win.exe
